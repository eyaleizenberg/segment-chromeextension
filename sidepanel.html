<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="sidepanel.css">
	<script src="event-store.js"></script>
	<script src="event-name-formatter.js"></script>
	<script src="event-click-handler.js"></script>
	<script src="sidepanel.js"></script>
</head>
<body>
	<header class="panelHeader">
		<img class="logo" src="logo32.png" alt="">
		<h1>Events tracked to Segment</h1>
		<div class="headerControls">
			<input type="text" id="filterInput" placeholder="Filter Events">
			<button type="button" id="configureButton" aria-label="Toggle configuration">&#9881;</button>
		</div>
	</header>
	<div id="contentDiv">
		<div id="trackMessages">
			Events will be here
		</div>
		<div class="buttonDiv">
			<input type="button" id="clearButton" value="Clear log from this tab">
			<input type="button" id="clearAllButton" value="Clear log from all tabs">
		</div>
	</div>
	<div id="configurationDiv" class="configurationDiv" hidden>
		<label>
			<input type="checkbox" id="snakeCaseEventNames">
			Display event names in snake_case
		</label>
		<label>
			<input type="checkbox" id="showAllTabs">
			Show events from all tabs
		</label>
		<label>
			<input type="checkbox" id="darkMode">
			Dark mode
		</label>
		<div class="apiDomainSetting">
			API domains - comma separated list of domains used for Segment and Dreamdata events publishing
			<textarea id="apiDomain" placeholder="api.segment.io,cdn.dreamdata.cloud" rows="3"></textarea>
		</div>
	</div>
</body>
</html>
